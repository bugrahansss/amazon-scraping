[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "amazon-scraping"
version = "0.1.0"
description = "Scrape Amazon product data, every color/size variation and all seller offers with Python."
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Buğrahan Saka" }]
keywords = ["amazon", "amazon scraper", "web scraping", "asin", "price tracking", "seller offers", "beautifulsoup"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
]
dependencies = ["requests>=2.25", "beautifulsoup4>=4.9"]

[project.urls]
Homepage = "https://github.com/bugrahansss/amazon-scraping"
Source = "https://github.com/bugrahansss/amazon-scraping"
Issues = "https://github.com/bugrahansss/amazon-scraping/issues"
Guide = "https://scrape.do/blog/amazon-scraping/"

[project.scripts]
amazon-scraping = "amazon_scraping.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
